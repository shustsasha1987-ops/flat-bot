name: Мониторинг квартир

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут; сайты проверяются ~каждые 5 минут
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять state.json (уже отправленные объявления)

concurrency:
  group: flat-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка сайтов и отправка в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SECONDS: "540"        # ~9 минут слушает кнопки, потом следующий запуск
        run: python bot.py
      - name: Сохранить состояние
        run: |
          git config user.name "flat-bot"
          git config user.email "flat-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%F' '%H:%M)"
          git pull --rebase -q || true
          git push
