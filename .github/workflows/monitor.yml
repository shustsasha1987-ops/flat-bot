name: Мониторинг квартир

on:
  schedule:
    - cron: "*/15 * * * *"   # запасной запуск, если цепочка прервётся
  workflow_dispatch:          # ручной запуск и запуск следующего звена цепочки

permissions:
  contents: write             # сохранять state.json
  actions: write              # запускать следующий запуск

concurrency:
  group: flat-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка сайтов, кнопки, отправка в Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_SECONDS: "3000"       # ~50 минут бот на связи, потом сразу следующий запуск
        run: python -u bot.py
      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "flat-bot"
          git config user.email "flat-bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%F' '%H:%M)"
          git pull --rebase -q || true
          git push
      - name: Запустить следующий запуск
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main
